    <script>
    document.addEventListener('DOMContentLoaded', function () {

  appId: "1:276392966927:web:3b77418cef82869a079c7a",
  measurementId: "G-6L9DEBGEXF"
        };

        // Initialize Firebase and Firestore
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- All other configuration (Web3Forms key, GPS coords, etc.) is the same ---
        const accessKey = "YOUR_WEB3FORMS_KEY_HERE"; 
        const SCHOOLHOUSE_LAT = 29.4241; 
        const SCHOOLHOUSE_LON = -98.4936; 
        // ... (all other config variables are the same)

        // --- REPLACEMENT FOR `localStorage` FUNCTIONS ---
        // The logic inside the functions below is the only part that needs to change significantly.
        // Instead of reading/writing to localStorage, we now read/write to Firestore.
        
        // --- LOGIN & DASHBOARD LOGIC (MODIFIED FOR FIREBASE) ---
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (document.getElementById('password').value === 'NTTCLACKLAND') {
                document.getElementById('staffLogin').style.display = 'none';
                document.getElementById('staffContent').style.display = 'block';
                startDashboard();
            }
        });

        function startDashboard() {
            // This is the magic of Firebase. `onSnapshot` is a LIVE listener.
            // Whenever data changes in the database, this code runs automatically.
            db.collection("libertyLog").onSnapshot(snapshot => {
                const log = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                updateAndRenderDashboard(log);
            });
            db.collection("geoViolations").onSnapshot(snapshot => {
                 const violations = snapshot.docs.map(doc => doc.data());
                 renderGeoViolations(violations);
            });
            db.collection("emergencyAlerts").onSnapshot(snapshot => {
                const alerts = snapshot.docs.map(doc => doc.data());
                renderEmergencyAlerts(alerts);
            });
        }
        
        function updateAndRenderDashboard(log) {
            // The logic to check for overdue students is the same,
            // but we now update the database if a change is found.
            log.forEach(entry => {
                if (entry.status === "Checked Out") {
                    const checkoutDate = new Date(entry.checkoutTime); // Assume checkoutTime is ISO string
                    const curfew = getCurfewForEntry(entry.liberty_phase, checkoutDate);
                    if (new Date() > curfew) {
                        // Update the entry in Firestore
                        db.collection("libertyLog").doc(entry.id).update({ status: "Overdue" });
                        // Add overdue notification logic here if needed
                    }
                }
            });
            
            // Separate logs for rendering
            const activeLog = log.filter(e => e.status === "Checked Out" || e.status === "Overdue");
            const checkedInLog = log.filter(e => e.status === "Checked In");

            // The rendering functions are mostly the same, just get their data from arguments
            renderActiveAndCheckedInTables(activeLog, checkedInLog);
        }

        // --- CHECK-IN / CHECK-OUT (MODIFIED FOR FIREBASE) ---
        // The `performGeoCheckedAction` function stays the same. The callbacks change.
        document.getElementById('libertyForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // ... (validation is the same)
            const studentName = document.getElementById('studentName').value;
            performGeoCheckedAction(() => {
                const newEntry = { ...Object.fromEntries(new FormData(e.target).entries()) };
                newEntry.status = "Checked Out";
                newEntry.checkoutTime = new Date().toISOString();
                
                // ADD to Firestore database instead of localStorage
                db.collection("libertyLog").add(newEntry)
                    .then(() => {
                        showResult('Success! You are checked out.', 'success');
                        e.target.reset();
                    })
                    .catch(err => showResult(`Error: ${err.message}`, 'danger'));
            }, studentName, "Check-Out");
        });
        
        // And so on for check-in, geo-violations, and emergency alerts.
        // Every `saveLog` is replaced with a `db.collection(...).add()` or `.update()`
        // Every `getLog` is replaced by the live `onSnapshot` listener in `startDashboard`.

        // --- IMPORTANT: This is a simplified representation. A full conversion requires
        // --- updating every function that touches `localStorage` to use Firestore instead.
        // --- The logic remains the same, only the data storage mechanism changes.

    });
    // All other helper functions (calculateDistance, showResult, getCurfew, render tables, etc.)
    // remain EXACTLY the same.
    </script>
